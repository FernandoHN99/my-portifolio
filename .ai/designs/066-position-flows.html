<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prévia dos fluxos da carteira</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#0c1011;color:#eef2ef;--accent:#b5dcc2;--muted:#94a39a;--line:#2a3630}*{box-sizing:border-box}body{margin:0;padding:32px 20px;min-height:100dvh;background:radial-gradient(ellipse at top,#1b2a23,transparent 65%)}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.preview{max-width:580px;margin:0 auto 22px}.preview p{font-size:13px;color:var(--muted);line-height:1.6}.switch{display:flex;gap:8px}.switch button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:11px 16px}.switch button.active{background:#b5dcc218;color:var(--accent)}.sheet{max-width:580px;margin:auto;background:#141c18;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 28px 90px #0005}header{padding:26px 28px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:20px}h1{font-size:23px;margin:0;letter-spacing:-.7px;font-weight:600}header p{font-size:13px;color:var(--muted);margin:9px 0 0}.close{margin-left:auto;color:var(--muted);font-size:22px}ol{list-style:none;display:flex;margin:0;padding:22px 28px;gap:18px;border-bottom:1px solid var(--line)}li{display:flex;align-items:center;gap:7px;flex:1;font-size:12px;color:var(--muted)}li b{display:grid;place-items:center;width:25px;height:25px;flex-shrink:0;border-radius:50%;border:1px solid var(--line);font-weight:500}li.current{color:var(--accent)}li.current b{background:var(--accent);color:#15231a;border-color:var(--accent)}li.done b{color:var(--accent);border-color:#5d8e6c}main{padding:26px 28px;min-height:325px}h2{margin:0;font-size:19px;letter-spacing:-.35px;font-weight:500}.explain{color:var(--muted);font-size:13px;line-height:1.7;margin:9px 0 22px}.field{display:block;margin:18px 0}.field span{display:flex;font-size:12px;margin-bottom:9px;color:#bdcac2;gap:12px}.field em{margin-left:auto;color:var(--accent);font-size:11px;font-style:normal}input,select{width:100%;border:1px solid #3a4d41;border-radius:10px;color:#edf2ed;background:#0f1612;min-height:47px;padding:12px 14px;font-size:16px}input.number{font-variant-numeric:tabular-nums;text-align:right}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid .field{margin:0}.summary{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;font-size:12px;color:var(--muted)}.summary strong{font-size:15px;font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums}.review{display:flex;flex-direction:column;padding:3px 0}.row{display:flex;align-items:center;gap:16px;padding:16px 0}.dot{height:11px;width:11px;border-radius:50%;border:1px solid #68796d;flex-shrink:0}.row:nth-child(2) .dot{background:var(--accent);border-color:var(--accent)}.row small{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.row strong{font-size:20px;font-weight:500;letter-spacing:-.45px}.row .sub{margin-left:auto;color:var(--muted);font-size:12px}.rule{height:18px;border-left:1px solid #496152;margin-left:5px}.note{border-top:1px solid var(--line);padding-top:18px;font-size:12px;color:var(--muted);line-height:1.6}footer{display:flex;align-items:center;gap:12px;padding:20px 28px;border-top:1px solid var(--line);background:#101713}footer small{margin-right:auto;font-size:11px;color:var(--muted)}footer button{border-radius:10px;padding:13px 18px;border:1px solid var(--line);background:transparent;color:#c0cfc4;font-size:13px}footer .primary{background:var(--accent);color:#132218;border-color:var(--accent);font-weight:600}.info{padding:14px 0;font-size:13px;color:var(--accent)}@media(max-width:480px){body{padding:20px 12px}header,main,ol,footer{padding-left:20px;padding-right:20px}h1{font-size:21px}ol{gap:9px}li{font-size:11px;gap:5px}footer small{display:none}footer button:last-child{margin-left:auto}.sheet{border-radius:18px}.grid{gap:12px}}
</style></head><body><div class="preview"><div class="switch"><button class="active" onclick="changeFlow('move')" id="move">Movimentar</button><button onclick="changeFlow('new')" id="new">Nova posição</button></div><p>Prévia interativa · dados de exemplo. Percorra as etapas para conferir a organização antes da implementação.</p></div><div class="sheet"><header><div><h1 id="title"></h1><p id="subtitle"></p></div><span class="close">×</span></header><ol id="steps"></ol><main id="content"></main><footer><small id="count"></small><button onclick="back()" id="back">Voltar</button><button class="primary" onclick="next()" id="next">Continuar</button></footer></div>
<script>
let flow='move',step=0,operation='CONTRIBUTION',mode='operation';const money=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});const labels={CONTRIBUTION:'Aporte',WITHDRAWAL:'Retirada',INCOME:'Rendimento'};
const field=(label,content)=>`<label class="field"><span>${label}</span>${content}</label>`;
function changeFlow(value){flow=value;step=0;render()}function back(){if(step>0)step--;render()}function next(){const last=flow==='move'?2:3;if(step<last){step++;render()}else document.getElementById('content').innerHTML='<h2>Resultado conferido</h2><p class="explain">Esta prévia não grava dados. O fluxo validado será usado no aplicativo.</p>'}
function render(){const names=flow==='move'?['Movimento','Valores','Conferir']:['Posição','Ativo','Rateio','Conferir'];document.getElementById('title').textContent=flow==='move'?'Movimentar posição':'Adicionar posição';document.getElementById('subtitle').textContent=flow==='move'?'ETF · VOO — exemplo de preenchimento':'Cadastre o ativo e confira os dados antes de salvar';document.getElementById('steps').innerHTML=names.map((name,i)=>`<li class="${i===step?'current':i<step?'done':''}"><b>${i<step?'✓':i+1}</b>${name}</li>`).join('');document.getElementById('move').className=flow==='move'?'active':'';document.getElementById('new').className=flow==='new'?'active':'';document.getElementById('count').textContent=`Etapa ${step+1} de ${names.length}`;document.getElementById('back').textContent=step?'Voltar':'Cancelar';document.getElementById('next').textContent=step===names.length-1?'Confirmar registro':'Continuar';let html='';
if(flow==='move'&&step===0)html='<h2>O que aconteceu com esta posição?</h2><p class="explain">Primeiro escolha o movimento. Os campos da próxima etapa se adaptam à sua escolha.</p>'+field('Movimento',`<select aria-label="Movimento" onchange="operation=this.value"><option value="CONTRIBUTION">Aporte — entrou dinheiro novo</option><option value="WITHDRAWAL">Retirada — saiu dinheiro</option><option value="INCOME">Rendimento — retorno do investimento</option></select>`)+'<div class="summary"><span>Saldo antes do movimento</span><strong>R$ 300,00 · 10 un.</strong></div>';
if(flow==='move'&&step===1)html='<h2>Informe os valores do '+labels[operation].toLowerCase()+'</h2><p class="explain">Preencha os dados que você tem. O app calcula o restante e sinaliza qualquer diferença.</p>'+field('Como você quer informar?',`<select aria-label="Como informar" onchange="mode=this.value;render()"><option ${mode==='operation'?'selected':''} value="operation">Pelo valor desta operação</option><option ${mode==='total'?'selected':''} value="total">Pelo novo total da posição</option></select>`)+(mode==='total'?field('Novo total da posição (R$)','<input class="number" aria-label="Novo total" value="360,00">'):'')+'<div class="grid">'+field(mode==='total'?'Quantidade movimentada':'Quantidade','<input class="number" aria-label="Quantidade" value="2">')+field('Preço executado (R$)','<input class="number" aria-label="Preço" value="25,00">')+'</div>'+field('Valor da operação (R$) <em>calculado</em>','<input class="number" aria-label="Valor da operação" value="50,00">')+'<div class="summary"><span>Próximo: confira o resultado</span><strong>12 unidades</strong></div>';
if(flow==='move'&&step===2)html='<h2>Confira o movimento</h2><p class="explain">O dinheiro movimentado e o valor de mercado aparecem separados.</p><div class="review"><div class="row"><span class="dot"></span><div><small>Antes</small><strong>R$ 300,00</strong></div><span class="sub">10 unidades</span></div><div class="rule"></div><div class="row"><span class="dot"></span><div><small>'+labels[operation]+'</small><strong>R$ 50,00</strong></div><span class="sub">2 × R$ 25,00</span></div><div class="rule"></div><div class="row"><span class="dot"></span><div><small>Depois · pela cotação do mês</small><strong>R$ 360,00</strong></div><span class="sub">12 unidades</span></div></div><div class="grid">'+field('Dia da movimentação','<input type="date" value="2026-10-04">')+field('Observação (opcional)','<input placeholder="Ex.: aporte do mês">')+'</div><p class="note">Você pode voltar para corrigir os valores antes de registrar.</p>';
if(flow==='new'&&step===0)html='<h2>Identifique sua posição</h2><p class="explain">Escolha onde ela está e como você quer identificá-la.</p><div class="grid">'+field('Tipo do ativo','<select><option>Cripto</option><option>Ação da B3</option><option>Renda fixa</option></select>')+field('Instituição','<select><option>Binance</option><option>Adicionar instituição</option></select>')+'</div>'+field('Nome do ativo','<input value="XRP">')+field('Estratégia (opcional)','<select><option>Sem estratégia</option></select>');
if(flow==='new'&&step===1)html='<h2>Informe o ativo e a quantidade</h2><p class="explain">A cotação atual é conferida automaticamente. Seu histórico será carregado na atualização das cotações.</p>'+field('Ticker','<input value="XRP">')+'<p class="info">✓ XRP conferido · R$ 13,27 por unidade (exemplo)</p>'+field('Quantidade atual','<input class="number" value="120">')+'<div class="summary"><span>Valor da posição</span><strong>R$ 1.592,40</strong></div>';
if(flow==='new'&&step===2)html='<h2>Defina o rateio</h2><p class="explain">Confirme a classificação que será usada nas metas da carteira.</p>'+field('Classe','<select><option>Cripto</option></select>')+'<div class="grid">'+field('Subclasse','<select><option>Altcoin</option></select>')+field('Peso','<input class="number" value="100%">')+'</div><div class="summary"><span>Total do rateio</span><strong>100%</strong></div>';
if(flow==='new'&&step===3)html='<h2>Confira sua nova posição</h2><p class="explain">Tudo pronto para cadastrar o ativo e começar seu acompanhamento.</p><div class="row"><div><small>Ativo · instituição</small><strong>XRP · Binance</strong></div></div><div class="row"><div><small>Quantidade atual</small><strong>120 XRP</strong></div><span class="sub">R$ 13,27 / unidade</span></div><div class="row"><div><small>Valor pela cotação conferida</small><strong>R$ 1.592,40</strong></div></div><p class="note">Classificação: Cripto → Altcoin · 100%<br>Estratégia: sem estratégia</p>';
document.getElementById('content').innerHTML=html;const chooser=document.querySelector('select[aria-label="Movimento"]');if(chooser)chooser.value=operation;}
render();
</script></body></html>
